<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="ui-monospace, Menlo, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1204"/>
      <stop offset="0.55" stop-color="#0d0d10"/>
      <stop offset="1" stop-color="#101620"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d7ff3f" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#d7ff3f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>

  <g transform="translate(100 80)">
