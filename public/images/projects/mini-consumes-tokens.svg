        <rect x="24" y="116" width="260" height="8" rx="4"/>
        <rect x="24" y="140" width="190" height="8" rx="4"/>
        <rect x="24" y="164" width="240" height="8" rx="4"/>
        <rect x="24" y="188" width="120" height="8" rx="4"/>
        <rect x="24" y="212" width="280" height="8" rx="4"/>
        <rect x="24" y="236" width="170" height="8" rx="4"/>
        <rect x="24" y="260" width="230" height="8" rx="4"/>
        <rect x="24" y="284" width="140" height="8" rx="4"/>
