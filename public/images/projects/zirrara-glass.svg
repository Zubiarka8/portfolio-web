<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="ui-monospace, Menlo, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0a1016"/>
      <stop offset="0.55" stop-color="#0d0d14"/>
      <stop offset="1" stop-color="#150f22"/>
    </linearGradient>
    <radialGradient id="orbA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6ad4ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6ad4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b06bff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#b06bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="470" cy="300" r="380" fill="url(#orbA)"/>
  <circle cx="1180" cy="620" r="420" fill="url(#orbB)"/>

  <!-- Main panel -->
  <g transform="translate(300 150)">
    <rect width="1000" height="600" rx="36" fill="url(#glass)" stroke="url(#edge)" stroke-width="2"/>
    <text x="56" y="84" fill="#f5f5f7" font-size="30" font-weight="700">zirrara-glass</text>
    <text x="944" y="84" fill="#a4a4b2" font-size="18" text-anchor="end">ui components</text>
    <path d="M56 120H944" stroke="#ffffff" stroke-opacity="0.14"/>

    <!-- Button row -->
    <g transform="translate(56 170)">
      <rect width="220" height="64" rx="32" fill="#d7ff3f"/>
      <text x="110" y="40" fill="#0d0d10" font-size="20" font-weight="700" text-anchor="middle">Primary</text>
      <rect x="244" width="220" height="64" rx="32" fill="url(#glass)" stroke="url(#edge)" stroke-width="2"/>
      <text x="354" y="40" fill="#f5f5f7" font-size="20" text-anchor="middle">Secondary</text>
      <rect x="488" width="64" height="64" rx="32" fill="url(#glass)" stroke="url(#edge)" stroke-width="2"/>
      <circle cx="520" cy="32" r="8" fill="#f5f5f7"/>
    </g>

    <!-- Input -->
    <g transform="translate(56 290)">
      <rect width="500" height="72" rx="20" fill="#000000" fill-opacity="0.25" stroke="url(#edge)" stroke-width="2"/>
      <text x="28" y="44" fill="#a4a4b2" font-size="20">Search components</text>
      <rect x="470" y="22" width="2" height="28" fill="#d7ff3f"/>
    </g>

    <!-- Toggles and slider -->
    <g transform="translate(56 410)">
      <rect width="120" height="60" rx="30" fill="#d7ff3f" fill-opacity="0.9"/>
      <circle cx="90" cy="30" r="22" fill="#0d0d10"/>
      <rect x="152" width="120" height="60" rx="30" fill="url(#glass)" stroke="url(#edge)" stroke-width="2"/>
      <circle cx="182" cy="30" r="22" fill="#f5f5f7" fill-opacity="0.85"/>
      <rect x="320" y="24" width="236" height="12" rx="6" fill="#ffffff" fill-opacity="0.16"/>
      <rect x="320" y="24" width="150" height="12" rx="6" fill="#6ad4ff"/>
      <circle cx="470" cy="30" r="18" fill="#f5f5f7"/>
    </g>

    <!-- Card -->
    <g transform="translate(616 170)">
      <rect width="328" height="290" rx="28" fill="url(#glass)" stroke="url(#edge)" stroke-width="2"/>
      <rect x="28" y="28" width="64" height="64" rx="18" fill="#b06bff" fill-opacity="0.8"/>
      <rect x="28" y="124" width="200" height="16" rx="8" fill="#f5f5f7" fill-opacity="0.85"/>
      <rect x="28" y="156" width="272" height="10" rx="5" fill="#ffffff" fill-opacity="0.3"/>
      <rect x="28" y="180" width="236" height="10" rx="5" fill="#ffffff" fill-opacity="0.3"/>
      <rect x="28" y="226" width="120" height="36" rx="18" fill="#ffffff" fill-opacity="0.14"/>
    </g>

    <!-- Platforms -->
    <g transform="translate(56 510)" fill="#a4a4b2" font-size="16">
      <rect width="104" height="44" rx="22" fill="#d7ff3f" fill-opacity="0.16" stroke="#d7ff3f" stroke-opacity="0.6"/>
      <text x="52" y="28" fill="#d7ff3f" text-anchor="middle">web</text>
      <rect x="124" width="124" height="44" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-dasharray="5 5"/>
      <text x="186" y="28" text-anchor="middle">android</text>
      <rect x="268" width="84" height="44" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-dasharray="5 5"/>
      <text x="310" y="28" text-anchor="middle">iOS</text>
      <rect x="372" width="124" height="44" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-dasharray="5 5"/>
      <text x="434" y="28" text-anchor="middle">desktop</text>
    </g>
  </g>
</svg>
