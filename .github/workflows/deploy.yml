name: Deploy to GitHub Pages

on:
  push:
    branches: [main, nextjs]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve site URL and base path
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          REPO="${GITHUB_REPOSITORY#*/}"
          # <owner>.github.io is served from the root; any other repo from /<repo>.
          if [ "${REPO,,}" = "${OWNER,,}.github.io" ]; then
            BASE_PATH=""
          else
            BASE_PATH="/${REPO}"
          fi
          echo "NEXT_PUBLIC_BASE_PATH=${BASE_PATH}" >> "$GITHUB_ENV"
          # A custom domain set as the repository variable SITE_URL wins.
          echo "NEXT_PUBLIC_SITE_URL=${SITE_URL:-https://${OWNER,,}.github.io${BASE_PATH}}" >> "$GITHUB_ENV"
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
